<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f4a3a">
<title>Homie</title>
<link rel="stylesheet" href="styles.css?v=ui2">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<script>window.__homieFail=function(m){if(document.getElementById('loadErr'))return;var d=document.createElement('div');d.id='loadErr';d.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;font:600 17px system-ui;color:#5a4632;z-index:999;pointer-events:auto';d.innerHTML='<div>לא הצלחנו לטעון את הבית — נסו לרענן</div><button onclick="location.reload()" style="padding:10px 20px;border-radius:12px;border:0;background:#5a4632;color:#fff;font:600 15px system-ui">רענון</button><small style="opacity:.5;font-weight:400">'+(m||'')+'</small>';document.body.appendChild(d)};
window.addEventListener('error',function(e){if(!window.__homieOk)__homieFail(e.message)},true);
setTimeout(function(){if(!window.__homieOk)__homieFail('timeout')},12000);</script>
</head>
<body>
<header class="top">
  <h1 class="logo"><span class="mark"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7v8.5a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z" fill="currentColor"/></svg></span><span class="word">homie</span><i>.</i></h1>
  <span class="actions"><button id="buildBtn" class="pill alt">✏️ עיצוב</button><button id="spendBtn" class="pill">הוצאות</button></span>
</header>
<div class="chips"><button id="setBtn" class="chip">🌳 קרקע</button><span class="csep"></span><button id="wallsPill" class="chip"></button></div>
<main id="stage"></main>
<div id="hint" class="hint">גרירה — סיבוב · צביטה/גלגלת — זום · שתי אצבעות/קליק ימני — הזזה</div>
<div id="sheet" class="sheet hidden"><div class="sheet-in">
  <div class="sheet-h"><h2>הוצאות</h2><button class="icon" id="closeSheet">✕</button></div>
  <ul id="list"></ul><div class="total">סה״כ: <b id="total"></b></div>
  <button id="addBtn" class="pill" style="margin-top:12px;width:100%">＋ הוסף מוצר</button></div></div>
<div id="buildBar" class="bbar hidden">
 <div id="colorPanel" class="cpanel hidden">
  <div class="crow" id="cProd"><span id="cProdName">בחרו רהיט</span><input type="color" id="prodColor"><small class="lbl">שנה הכל</small><button class="mini" id="prodReset">מקורי</button></div>
  <div class="parts" id="cParts"></div>
  <div class="crow"><span>קירות</span><input type="color" id="wallColor"><button class="mini" id="wallReset">מקורי</button></div>
  <div class="crow"><span>רצפה</span><select id="floorRoom"></select><input type="color" id="floorColor"></div>
 </div>
 <span id="tip"></span>
 <div class="tools"><button class="tb" data-tool="move"><b>✋</b>הזז</button><button id="rotBtn" class="tb hidden"><b>🔄</b>סובב</button><button class="tb" data-tool="wall"><b>✏️</b>קיר</button><button class="tb" data-tool="erase"><b>🗑️</b>מחק</button><button class="tb" data-tool="color"><b>🎨</b>צבע</button><button id="wallsBtn" class="tb on" title="מצב קירות"></button><span class="sep"></span><button id="undoBtn" class="tb"><b>↩️</b>בטל</button><button id="doneBtn" class="tb done"><b>✔</b>סיום</button></div></div>
<div id="card" class="card hidden"></div>
<div id="confirm" class="sheet center hidden"><div class="dlg"><div id="confirmIcon" class="ce"></div><b id="confirmMsg"></b><div class="dbtns"><button id="confirmNo" class="mini">ביטול</button><button id="confirmYes" class="pill danger">אישור</button></div></div></div>
<div id="formSheet" class="sheet hidden"><div class="sheet-in"><form id="addForm">
 <div class="sheet-h"><h2>מוצר חדש</h2><button type="button" class="icon" id="cancelAdd">✕</button></div>
 <label>שם<input name="name" required></label><label>מחיר (Kč)<input name="price" type="number" inputmode="numeric" required></label>
 <label>תאריך<input name="date" type="date"></label><label>חדר<select name="room" id="roomSel"></select></label>
 <label>סוג<select name="icon"><option>🛋️</option><option>📺</option><option>🧊</option><option>🍽️</option><option>🛏️</option><option>🧺</option><option>📦</option></select></label>
 <button class="pill" style="width:100%;margin-top:10px">שמור</button></form></div></div>
<script type="module" src="app.js?v=ui2"></script>
</body></html>
